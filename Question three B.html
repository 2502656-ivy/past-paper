<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kenya News Portal</title>

  <style>
    /* Remove default page spacing */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Navigation bar */
    nav {
      background-color: #1a1a2e;       /* dark background */
      display: flex;                   /* makes the links horizontal */
      justify-content: space-evenly;   /* links are evenly spaced */
      padding: 15px 0;
    }

    /* Links */
    nav a {
      color: white;                    /* white link text */
      text-decoration: none;           /* no underline */
      font-size: 18px;
    }

    /* Hover effect */
    nav a:hover {
      color: #f0a500;                  /* orange on hover */
    }
  </style>
</head>

  </nav>

</html>
